<div class="page">
    <div class="page-header has-filters">
        <div class="page-header-top">
            <h2 class="page-header-title">
                <span class="page-header-title-text" translate="filter.home.title"></span>
            </h2>
        </div>
        <app-external-resources-search [filters]="this.filterSearch"></app-external-resources-search>
    </div>
    <div class="page-body">
        <arte-spinner *ngIf="!externalCkanItems"></arte-spinner>
        <ng-container *ngIf="externalCkanItems">
            <ng-container *ngIf="externalCkanItems.length > 0;else emptyList">
                <div class="page-table-container-fluid">
                    <arte-table
                        [columns]="columns"
                        [value]="externalCkanItems"
                        [rows]="itemsPerPage"
                        [totalRecords]="totalItems"
                        tableStyleClass="page-table table-has-pointer-rows"
                        (onLazyLoad)="loadData($event)"
                    >
                        <ng-template pTemplate="body" let-filter>
                            <tr>
                                <td>{{filter.name}}</td>
                                <td>{{filter.type}}</td>
                                <td>{{filter.code}}</td>
                                <td>{{filter.createdDate | date: 'd/M/yyyy H:mm:ss' }}</td>
                            </tr>
                        </ng-template>
                    </arte-table>
                </div>
            </ng-container>
            <ng-template #emptyList>
                <arte-entity-list-empty></arte-entity-list-empty>
            </ng-template>
        </ng-container>
    </div>
</div>
